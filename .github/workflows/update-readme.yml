name: Update README
on:
  schedule:
    - cron: "1 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm install
      - name: Generate README
        env:
          ACCESSTOKEN: ${{ secrets.ACCESSTOKEN }}
        run: npm run scripts:readme
      - name: Generate leagues manifest
        env:
          ACCESSTOKEN: ${{ secrets.ACCESSTOKEN }}
        run: npm run scripts:manifest
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md docs/leagues.json
          git diff --staged --quiet || git commit -m "Update README.md and leagues manifest"
      - name: Push changes
        run: git push origin main
