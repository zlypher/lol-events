<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>League of Legends - Event Calendars</title>
        <meta
            name="description"
            content="Subscribe to live League of Legends esports event calendars in .ical format for Google Calendar, Apple Calendar, and Outlook."
        />
        <link rel="stylesheet" href="./style.css" />
        <script type="module" src="./app.js"></script>
    </head>
    <body>
        <header class="site-header">
            <div class="container header-content">
                <div class="header-title-group">
                    <h1>League of Legends Calendars</h1>
                    <p class="header-subtitle">
                        Subscribe to official match schedules for your favourite
                        leagues in <code>.ical</code> format
                    </p>
                </div>
                <div class="header-links">
                    <a
                        href="https://github.com/zlypher/lol-events"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        <span>GitHub Repository</span>
                        <span aria-hidden="true">↗</span>
                    </a>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="container">
                <section class="toolbar" aria-label="League search and filters">
                    <div class="toolbar-controls">
                        <div class="search-wrapper">
                            <span class="search-icon" aria-hidden="true">🔍</span>
                            <input
                                type="search"
                                id="search-input"
                                class="search-input"
                                placeholder="Search leagues by name or slug (e.g. LEC, Worlds, LCS)..."
                                aria-label="Search leagues by name or slug"
                                autocomplete="off"
                            />
                        </div>

                        <div
                            class="category-filters"
                            id="category-filters"
                            role="group"
                            aria-label="Filter leagues by status"
                        >
                            <button
                                type="button"
                                class="filter-btn active"
                                data-category="all"
                            >
                                All <span class="count"></span>
                            </button>
                            <button
                                type="button"
                                class="filter-btn"
                                data-category="active"
                            >
                                Active <span class="count"></span>
                            </button>
                            <button
                                type="button"
                                class="filter-btn"
                                data-category="inactive"
                            >
                                Inactive <span class="count"></span>
                            </button>
                        </div>
                    </div>

                    <div
                        class="summary-count"
                        id="summary-count"
                        aria-live="polite"
                    ></div>
                </section>

                <div
                    id="status-container"
                    class="status-container"
                    aria-live="polite"
                ></div>

                <section
                    id="leagues-grid"
                    class="leagues-grid"
                    aria-label="Available leagues"
                ></section>
            </div>
        </main>

        <footer class="site-footer">
            <div class="container footer-content">
                <p>
                    Data and images provided by
                    <a
                        href="https://pandascore.co/"
                        target="_blank"
                        rel="noopener noreferrer"
                        >PandaScore</a
                    >.
                </p>
                <p>
                    Open source project licensed under
                    <a
                        href="https://github.com/zlypher/lol-events/blob/main/LICENSE"
                        target="_blank"
                        rel="noopener noreferrer"
                        >MIT</a
                    >.
                </p>
            </div>
        </footer>
    </body>
</html>
